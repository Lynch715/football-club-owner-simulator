function renderPanel(){({overview:renderOverview,squad:renderSquad,transfer:renderTransfer,youth:renderYouth,coach:renderCoach,business:renderBusiness,relations:renderRelations,schedule:renderSchedule,log:renderLog}[S.tab]||renderOverview)()}
function renderAll(){if(!S||typeof document==="undefined")return;renderStats();renderForecast();renderClubStrip();renderActions();document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));renderPanel();save()}
function switchTab(tab){S.tab=tab;renderAll()}

function openBid(id){if(!inTransferWindow(S)){showModal("转会窗尚未开放","可以继续考察，但新球员只能在赛季第1、2、6月完成注册。",[{text:"知道了"}]);return}if(!needEnergy())return;const p=S.market.find(x=>x.id===id);if(!p)return;const director=S.npcs.find(n=>n.id==="director").fav,opts=[[.86,"试探报价"],[1,"按要价谈"],[1.16,"强势拿人"]];showModal(`向${p.origin}报价`,`${p.name}，${POS[p.pos]}，能力${p.ability}，身价${p.value}万。\n对方要价${p.ask}万。`,opts.map(([m,label])=>{const fee=Math.round(p.ask*m/10)*10;return eventOption(label,`${fee}万；报价越高，俱乐部越容易接受`,()=>clubNegotiation(p,fee,director),S.cash<fee)}))}
function clubNegotiation(p,fee,directorFav){spend();const chance=clamp(.26+fee/p.ask*.48+(directorFav-50)/170+(p.origin==="北港海星"?relationPower("rival")*.15:0),.12,.96);if(Math.random()>chance){gameLog(S,"bad",`${p.origin}拒绝了对${p.name}的${fee}万报价。`);showModal("俱乐部拒绝报价","对方回复得很快：报价没有达到内部估值。",[{text:"本月还能再找别人"}]);return}showModal("俱乐部同意谈判",`${p.origin}接受${fee}万报价。现在轮到球员和经纪人。`,[[12,.92,"一年低薪"],[24,1,"两年标准合同"],[36,1.12,"三年保障合同"]].map(([months,w,label])=>{const wage=round(p.wage*w,1);return eventOption(label,`月薪${wage}万，合同${months}个月`,()=>playerNegotiation(p,fee,wage,months))}))}
function playerNegotiation(p,fee,wage,months){const agentBoost=Math.max(...S.npcs.filter(n=>n.group==="经纪人").map(n=>n.fav))-50,chance=clamp(.48+(wage/p.wage-1)*1.2+(months-12)/75+(p.willing-50)/120+agentBoost/260,.15,.97);if(Math.random()>chance){gameLog(S,"bad",`${p.name}拒绝了个人合同。`);showModal("球员没有签字","经纪人说，球员对薪资、出场前景或城市仍有顾虑。俱乐部报价不会扣款。",[{text:"谈判结束"}]);return}S.cash-=fee;p.wage=wage;p.contract=months;p.origin="本队";p.scouted=true;p.listed=false;S.roster.push(p);S.market=S.market.filter(x=>x.id!==p.id);S.track.bought++;S.track.transferSpend+=fee;S.reputation=clamp(S.reputation+(p.ability>=70?2:0));gameLog(S,"good",`以${fee}万签下${p.name}，月薪${wage}万，合同${months}个月。`);showModal("签约完成",`${p.name}在合同上签了字。体育总监提醒你：现在工资总额是${Math.round(payroll(S))}万/月。`,[{text:"看看新阵容",fn:()=>switchTab("squad")}])}
function toggleList(id){const p=S.roster.find(x=>x.id===id);if(!p)return;p.listed=!p.listed;p.morale=clamp(p.morale+(p.listed?-7:3));if(p.listed)risk(S,"dressing",2);gameLog(S,p.listed?"bad":"",`${p.name}${p.listed?"被列入出售名单":"撤下了出售名单"}。`);renderAll()}
function generateIncomingOffers(s,rng=Math.random){if(!inTransferWindow(s))return[];const rows=[];s.roster.filter(p=>p.listed||rng()<.035).forEach(p=>{if(rng()<.48){const club=pick(s.clubs.filter(c=>c.id!=="me"),rng),mult=p.listed?rand(.78,1.08,rng):rand(1,1.32,rng);rows.push({id:`offer_${s.globalMonth}_${Math.floor(rng()*1e8)}`,playerId:p.id,club:club.name,fee:Math.round(p.value*mult/10)*10})}});return rows.slice(0,5)}
function acceptSale(id){const o=S.incomingOffers.find(x=>x.id===id),p=o&&S.roster.find(x=>x.id===o.playerId);if(!o||!p)return;showModal("确认出售",`${o.club}愿意支付${o.fee}万购买${p.name}。出售后无法撤回。`,[eventOption("接受报价",`现金+${o.fee}万`,()=>{S.cash+=o.fee;S.roster=S.roster.filter(x=>x.id!==p.id);S.incomingOffers=S.incomingOffers.filter(x=>x.playerId!==p.id);S.track.sold++;S.track.transferIncome+=o.fee;if(p.ability>=70){S.fans=clamp(S.fans-4);risk(S,"fans",6)}gameLog(S,"good",`以${o.fee}万将${p.name}出售给${o.club}。`);renderAll()}),eventOption("暂不出售","",()=>{})])}
function rejectSale(id){const o=S.incomingOffers.find(x=>x.id===id);if(!o)return;S.incomingOffers=S.incomingOffers.filter(x=>x.id!==id);const p=S.roster.find(x=>x.id===o.playerId);if(p)p.morale=clamp(p.morale+(p.listed?-2:2));gameLog(S,"",`拒绝了${o.club}的报价。`);renderAll()}
function renewPlayer(id){if(!needEnergy())return;const p=S.roster.find(x=>x.id===id);if(!p)return;showModal(`与${p.name}续约`,`当前月薪${p.wage}万，合同剩余${p.contract}个月。`,[[12,1.08],[24,1.18],[36,1.28]].map(([m,w])=>eventOption(`续约${m}个月`, `新月薪${round(p.wage*w,1)}万`,()=>{spend();const chance=clamp(.78+(w-1)*.5+p.morale/350-(p.ability>=72?.12:0),.35,.96);if(Math.random()<chance){p.wage=round(p.wage*w,1);p.contract=m;p.morale=clamp(p.morale+6);gameLog(S,"good",`与${p.name}续约${m}个月。`);showModal("续约完成","经纪人收起合同，球员第二天照常参加训练。",[{text:"完成"}])}else{p.morale=clamp(p.morale-5);risk(S,"dressing",4);showModal("续约没有谈妥","球员希望获得更高工资或更明确的地位。",[{text:"以后再谈"}])}})))}
function releasePlayer(id){const p=S.roster.find(x=>x.id===id);if(!p)return;const cost=Math.round(p.wage*Math.min(p.contract,10)*.45);showModal("协商解约",`提前终止${p.name}的合同需支付约${cost}万。更衣室会注意你怎样处理离队球员。`,[eventOption("支付补偿并解约",`现金-${cost}万`,()=>{S.cash-=cost;S.roster=S.roster.filter(x=>x.id!==id);risk(S,"dressing",5);gameLog(S,"bad",`支付${cost}万与${p.name}提前解约。`);renderAll()},S.cash<cost),eventOption("取消","",()=>{})])}
function promoteYouth(id){const p=S.youth.find(x=>x.id===id);if(!p)return;p.origin="本队";p.wage=round(Math.max(2.5,p.wage),1);p.contract=Math.max(24,p.contract);p.scouted=true;S.youth=S.youth.filter(x=>x.id!==id);S.roster.push(p);S.seasonYouth++;S.track.youthPromoted++;S.fans=clamp(S.fans+1);gameLog(S,"good",`${p.name}从青训营进入一线队。`);renderAll()}
function releaseYouth(id){const p=S.youth.find(x=>x.id===id);if(!p)return;S.youth=S.youth.filter(x=>x.id!==id);gameLog(S,"",`${p.name}离开青训营。`);renderAll()}
function upgradeAcademy(){if(S.academyLevel>=5)return;const cost=[0,600,1050,1650,2500][S.academyLevel];if(S.cash<cost)return;S.cash-=cost;S.academyLevel++;S.track.facilityUpgrades++;gameLog(S,"good",`投入${cost}万，将青训学院升级到${S.academyLevel}级。`);renderAll()}

function signSponsor(slot,id){if(!needEnergy())return;const o=(S.sponsorOffers[slot]||[]).find(x=>x.id===id);if(!o)return;const existing=S.sponsors[slot],cost=existing?Math.round(existing.monthly*2):0;showModal(`签下${o.name}`,`${SPONSOR_SLOTS[slot]}合同：每月${o.monthly}万，签字费${o.bonus}万。\n要求：${o.requirement}。未完成需赔付${o.penalty}万。${existing?`\n替换现合同需支付${cost}万。`:""}`,[eventOption("签约",`立即净收入${o.bonus-cost}万`,()=>{spend();S.cash+=o.bonus-cost;S.sponsors[slot]={...o,months:11-S.seasonMonth};relation(S,slot==="shirt"?"sp1":slot==="kit"?"sp2":"sp3",4);gameLog(S,"good",`与${o.name}签订${SPONSOR_SLOTS[slot]}合同。`);renderAll()}),eventOption("暂不签","",()=>{})])}
function upgradeFacility(key){const f=FACILITIES[key],lv=S.stadium[key];if(lv>=5||S.facilityProjects.some(x=>x.key===key))return;const cost=f.cost[lv];if(S.cash<cost)return;S.cash-=cost;S.facilityProjects.push({key,months:2});gameLog(S,"",`${f.name}升级工程开工，投入${cost}万。`);renderAll()}
function repayDebt(n){if(S.cash<n+200||S.debt<=0)return;const amt=Math.min(n,S.debt);S.cash-=amt;S.debt-=amt;risk(S,"finance",-6);gameLog(S,"good",`偿还债务${amt}万。`);renderAll()}

const RISK_NAMES={finance:"财务",dressing:"更衣室",fans:"球迷",safety:"球场安全",compliance:"合规"};
const RISK_WARNINGS={finance:{title:"财务总监要求紧急见面",body:"现金、债务和工资曲线已经挤到一起。再拖下去，俱乐部会开始借新钱发旧工资。",fix:"处置资产并压缩支出",cost:150,delta:-18,ignore:12},dressing:{title:"更衣室开始分成小圈子",body:"训练照里所有人都在笑，但队长说，有些人已经不愿意在一张桌上吃饭。",fix:"发放团队奖金并调解",cost:220,delta:-22,ignore:13},fans:{title:"球迷组织准备联合抗议",body:"成绩、票价、卖人和冠名争议叠在了一起。下一场主场可能出现大面积空座。",fix:"召开公开球迷会议",cost:100,delta:-23,ignore:14},safety:{title:"安保部门提交红色预警",body:"护栏、通道和高风险比赛安排同时出现问题。这已经不是观赛体验。",fix:"进行紧急安全整改",cost:260,delta:-25,ignore:15},compliance:{title:"审计要求补充材料",body:"几笔经纪佣金、赞助回款和工程款缺少完整流程。现在补还能解释。",fix:"聘请外部审计整改",cost:180,delta:-24,ignore:14}};
function chooseEvent(){const rows=EVENTS.filter(e=>(!e.cond||e.cond())&&!S.usedEvents.includes(e.id)&&e.id!==S.lastEvent);if(!rows.length)return null;const e=pick(rows);S.lastEvent=e.id;S.usedEvents.push(e.id);return e}
function riskWarning(){const rows=Object.keys(S.risks).filter(k=>S.risks[k]>=64&&(S.warningMonth[k]||0)<S.globalMonth-1);if(!rows.length)return null;return rows.sort((a,b)=>S.risks[b]-S.risks[a])[0]}
function disasterCheck(){if(S.cash<-1500||S.risks.finance>=112)return["俱乐部进入破产托管","工资、税款和债务同时逾期。联盟接管了俱乐部账户，你失去了董事会席位。球员仍会比赛，但老板已经不是你。"];if(S.risks.fans>=112)return["看台失控","抗议在一次主场失利后演变为冲突。联赛处罚、空场和舆论压力同时到来，董事会决定终止你的管理权。"] ;if(S.risks.safety>=112)return["球场事故","被推迟的整改终于以最坏的方式追上了俱乐部。比赛不再重要，所有人都在问为什么那些预警没有被处理。"] ;if(S.risks.compliance>=115)return["财务调查","转会佣金、工程合同和赞助款被合并调查。你的名字从主席台移到了通报里。"] ;if(S.board<=5)return["董事会解雇","会议只进行了十七分钟。方敬山代表董事会宣布解除你的职务，理由是成绩、预算和信任同时失控。"] ;return null}

function processFacilities(s){s.facilityProjects.forEach(p=>p.months--);const done=s.facilityProjects.filter(p=>p.months<=0);done.forEach(p=>{s.stadium[p.key]=clamp(s.stadium[p.key]+1,1,5);s.track.facilityUpgrades++;gameLog(s,"good",`${FACILITIES[p.key].name}升级完成，达到${s.stadium[p.key]}级。`)});s.facilityProjects=s.facilityProjects.filter(p=>p.months>0)}
function developPlayers(s,rng=Math.random){s.roster.forEach(p=>{p.injury=Math.max(0,p.injury-1);p.suspended=Math.max(0,p.suspended-1);p.contract--;if(p.age<=23&&rng()<.12+s.coach.youth/700)p.ability=Math.min(p.potential,p.ability+1);if(p.age>=32&&rng()<.12)p.ability=Math.max(40,p.ability-1);p.value=valueFor(p)});s.youth.forEach(p=>{p.contract--;const chance=.22+s.academyLevel*.055+s.coach.youth/500;if(rng()<chance)p.ability=Math.min(p.potential,p.ability+1);p.form=clamp(p.form+rand(-2,3,rng))});const expired=s.roster.filter(p=>p.contract<=0);expired.forEach(p=>{gameLog(s,"bad",`${p.name}合同到期，以自由球员身份离队。`);risk(s,"dressing",3)});s.roster=s.roster.filter(p=>p.contract>0);s.youth=s.youth.filter(p=>p.contract>0)}
function settleFinance(s){const before={cash:s.cash,fans:s.fans,board:s.board,rating:teamRating(s),rank:leagueRank(s)},f=projectedFinance(s);s.cash+=f.net;s.track.sponsorIncome+=f.sponsor;s.track.gateIncome+=f.gate;Object.values(s.sponsors).filter(Boolean).forEach(sp=>sp.months--);if(f.net<0)risk(s,"finance",Math.min(8,Math.abs(f.net)/160));else risk(s,"finance",-2);if(payroll(s)>s.wageBudget){risk(s,"finance",5);s.board=clamp(s.board-1)}if(s.cash<0)risk(s,"finance",8);if(s.stadium.safety<=2)risk(s,"safety",2);if(s.coach.authority<35)risk(s,"dressing",5);processFacilities(s);developPlayers(s);s.coach.months++;s.track.maxCash=Math.max(s.track.maxCash,s.cash);s.track.maxFans=Math.max(s.track.maxFans,s.fans);s.last={...f};s.lastDelta={cash:s.cash-before.cash,fans:s.fans-before.fans,board:s.board-before.board,rating:teamRating(s)-before.rating,rank:before.rank-leagueRank(s)};return f}
function showMonthReport(fin,reports){const all=reports.filter(Boolean);$("#modalTitle").textContent=`第${S.season}赛季${S.seasonMonth}月 · 月报`;const body=$("#modalBody");body.innerHTML=`<div class="report-line"><span>比赛日与赞助收入</span><span class="up">+${fin.income}万</span></div><div class="report-line"><span>工资、维护、青训与利息</span><span class="down">-${fin.expense}万</span></div><div class="report-line"><span><b>当月现金净额</b></span><span class="${fin.net>=0?"up":"down"}"><b>${fin.net>=0?"+":""}${fin.net}万</b></span></div>${all.map(r=>`<div class="report-line"><span>${esc(r.competition)} ${r.home?"主":"客"} vs ${esc(r.opponent)}</span><span class="${r.gf>r.ga?"up":r.gf<r.ga?"down":"gold"}"><b>${r.gf}-${r.ga}${r.penalties?` ${r.penalties}`:""}</b></span></div><div class="copy">进球：${r.scorers.length?r.scorers.join("、"):"无"}；牌${r.cards}张；最佳${esc(r.motm)}。${r.injury?` ${esc(r.injury)}。`:""}${r.verdict}</div>`).join("")}`;const box=$("#modalOptions");box.innerHTML="<button>继续</button>";box.firstChild.onclick=()=>{$("#mask").classList.remove("show");flushQueue()};$("#mask").classList.add("show")}
function seasonReview(){const rank=leagueRank(S),boardOk=rank<=S.targets.boardRank&&S.cup.stage>=S.targets.boardCup,fanOk=rank<=S.targets.fanRank&&S.seasonWins>=S.targets.fanWins;S.board=clamp(S.board+(boardOk?10:-13));S.fans=clamp(S.fans+(fanOk?7:-8));if(rank===1){S.track.leagueTitles++;S.track.trophies++;S.cash+=1200;S.reputation=clamp(S.reputation+10)}Object.values(S.sponsors).filter(Boolean).forEach(sp=>{if(!seasonSponsorSuccess(S,sp)){S.cash-=sp.penalty;gameLog(S,"bad",`${sp.name}的赛季要求未完成，赔付${sp.penalty}万。`)}else S.reputation=clamp(S.reputation+2)});const record={season:S.season,rank,w:S.seasonWins,d:S.seasonDraws,l:S.seasonLosses,cup:S.cup.winner?"冠军":S.cup.stage,boardOk,fanOk,cash:Math.round(S.cash)};S.history.push(record);return record}
function startNextSeason(){S.season++;S.seasonMonth=1;S.globalMonth++;S.energy=4;S.seasonWins=0;S.seasonDraws=0;S.seasonLosses=0;S.seasonYouth=0;S.cup={alive:true,stage:0,winner:false,results:[]};S.clubs=makeClubs(S);S.schedule=createSchedule(S.clubs);const intake=createYouth({...ARCHETYPES[S.archetype],academy:S.academyLevel},Math.random,5);S.youth.push(...intake);S.targets=seasonTargets(S);S.sponsors={shirt:null,kit:null,stadium:null};S.market=makeMarket(S);S.incomingOffers=generateIncomingOffers(S);S.coachCandidates=makeCoachCandidates(S);S.sponsorOffers=makeSponsorOffers(S);gameLog(S,"month",`第${S.season}赛季开始，5名新学员进入青训营。董事会目标联赛前${S.targets.boardRank}。`);showModal("新赛季开始",`董事会目标：联赛前${S.targets.boardRank}，杯赛至少${S.targets.boardCup===1?"八强":"半决赛"}。\n球迷目标：联赛前${S.targets.fanRank}，至少${S.targets.fanWins}场胜利。\n\n三个赞助位置已重新开放，青训营新增5名学员。`,[{text:"进入转会窗口"}])}
function finalEnding(s){const titles=s.track.trophies,profit=s.track.transferIncome-s.track.transferSpend,rank=s.history.at(-1)?.rank||leagueRank(s);if(s.track.leagueTitles>=2)return["联赛王朝","三年里，两次冠军把质疑变成了历史注脚。你仍然不排首发，但每一个决定都改变了谁有资格穿上这件球衣。",true];if(titles>=2)return["奖杯陈列室","联赛和杯赛的奖杯终于不再只是老照片里的东西。球迷学会了在五月谈决赛，而不是谈重建。",true];if(s.track.youthPromoted>=7&&s.academyLevel>=4)return["青训之城","你没有买下所有答案。训练基地里一批年轻人走进一线队，其中几个人已经成了这座城市新的名字。",true];if(profit>1500&&s.cash>5000&&rank<=6)return["经营模范","卖人、买人、赞助和球场工程最后落在同一本健康的账上。董事会第一次发现，稳定也可以成为雄心。",true];if(rank<=4)return["稳定强队","没有王朝，也没有崩盘。三个赛季后，任何争冠讨论都不会再忽略你的俱乐部。",true];if(rank>=9)return["勉强留在牌桌","你躲过了降级和破产，但看台没有为资产负债表鼓掌。下一位老板接手时，仍会说这是一次重建。",false];return["中游老板","三年过去，球队赢过强敌，也在该赢的比赛里丢过分。你证明了俱乐部可以运转，却还没有证明它为什么必须属于你。",false]}
function showSeasonReview(r){showModal(`第${r.season}赛季结束 · 第${r.rank}名`,`联赛成绩：${r.w}胜${r.d}平${r.l}负。\n杯赛：${S.cup.winner?"冠军":S.cup.stage===0?"首轮出局":`止步第${S.cup.stage+1}阶段`}。\n董事会目标：${r.boardOk?"完成":"未完成"}。\n球迷目标：${r.fanOk?"完成":"未完成"}。\n赛季末现金：${r.cash}万。`,[{text:r.season>=MAX_SEASON?"查看三年结局":"进入下赛季",fn:()=>{if(r.season>=MAX_SEASON){const e=finalEnding(S);showEnd(e[0],e[1],e[2])}else startNextSeason()}}])}
function showEnd(title,story,good){S.over=true;S.endData={title,story,good};save();modalQueue=[];$("#mask").classList.remove("show");const profit=S.track.transferIncome-S.track.transferSpend,grid=[["奖杯",`${S.track.trophies}座`],["最佳排名",S.history.length?`第${Math.min(...S.history.map(x=>x.rank))}名`:"-"],["转会净额",`${profit>=0?"+":""}${Math.round(profit)}万`],["青训提拔",`${S.track.youthPromoted}人`],["最终现金",`${Math.round(S.cash)}万`],["教练更换",`${S.track.coachChanges}次`]];$("#endCard").innerHTML=`<div class="eyebrow">《模拟足球老板》三赛季结算 · ${esc(S.clubName)}</div><h2>${good?"▣":"□"} ${title}</h2><div class="story">${story}</div><div class="metric-grid">${grid.map(([k,v])=>`<div class="metric"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div><div class="badges"><span class="badge">${ARCHETYPES[S.archetype].name}</span>${S.track.leagueTitles?'<span class="badge">联赛冠军</span>':""}${S.cup.winner?'<span class="badge">杯赛夺冠</span>':""}${S.academyLevel>=4?'<span class="badge">青训基地</span>':""}</div><button class="primary" style="width:100%;margin-top:10px" onclick="restartGame()">再买一家俱乐部</button>`;$("#ending").classList.add("show")}
function advanceMonth(){S.seasonMonth++;S.globalMonth++;S.energy=4;S.market=makeMarket(S);S.incomingOffers=generateIncomingOffers(S);S.coachCandidates=makeCoachCandidates(S);S.sponsorOffers=makeSponsorOffers(S);gameLog(S,"month",`进入第${S.seasonMonth}月，市场、教练和赞助候选已刷新。`);flushQueue()}
function doEndMonth(){const currentRoundIndexes=roundsThisMonth(S).map(x=>x.index+1),fin=settleFinance(S),leagueReports=simulateLeagueMonth(S);leagueReports.forEach((r,i)=>S.matchHistory.push({...r,season:S.season,round:currentRoundIndexes[i]}));const cup=simulateCup(S),reports=[...leagueReports,...(cup?[cup]:[])],tasks=[()=>showMonthReport(fin,reports)],disaster=disasterCheck();if(disaster){tasks.push(()=>showEnd(disaster[0],disaster[1],false));queueAll(tasks);return}const warning=riskWarning();if(warning){const w=RISK_WARNINGS[warning];S.warningMonth[warning]=S.globalMonth;S.warnings[warning]++;tasks.push(()=>showModal(`${RISK_NAMES[warning]}预警 · ${w.title}`,w.body,[eventOption(w.fix,`花${w.cost}万，风险-${Math.abs(w.delta)}`,()=>{S.cash-=w.cost;risk(S,warning,w.delta);gameLog(S,"good",`${RISK_NAMES[warning]}专项整改完成。`)},S.cash<w.cost),eventOption("暂时压住","风险继续上升",()=>{risk(S,warning,w.ignore);gameLog(S,"bad",`${RISK_NAMES[warning]}预警被搁置。`)})]))}else{const e=chooseEvent();if(e)tasks.push(()=>showModal(`俱乐部事件 · ${e.title}`,typeof e.body==="function"?e.body():e.body,e.opts()))}if(S.seasonMonth>=MONTHS_PER_SEASON){const review=seasonReview();if(review.rank>=11){tasks.push(()=>showEnd("降级与解雇",`${S.clubName}以联赛第${review.rank}名降级。董事会没有接受“下一年打回来”的方案，你的三年计划提前结束。`,false))}else if(S.board<=5){tasks.push(()=>showEnd("董事会解雇","赛季复盘没有进入预算环节。董事会先投票终止了你的职务。",false))}else tasks.push(()=>showSeasonReview(review))}else tasks.push(()=>advanceMonth());queueAll(tasks)}
function endMonth(){if(S.over)return;if(S.energy>0){showModal("本月还有行动力",`还剩${S.energy}点行动力，确定直接结算比赛和财务？`,[eventOption("直接结算","剩余行动力作废",()=>doEndMonth()),eventOption("回去再看看","",()=>{})]);return}doEndMonth()}
function requestRestart(){showModal("重新开始",S?`确定放弃${S.clubName}当前的全部进度？`:"确定重新开始？",[eventOption("确认重开","本地存档会被覆盖",()=>restartGame()),eventOption("取消","",()=>{})])}
function restartGame(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;modalQueue=[];$("#ending").classList.remove("show");$("#mask").classList.remove("show");$("#creator").classList.add("show");renderCreator()}
function init(){renderCreator();if(load()){$("#creator").classList.remove("show");renderAll();if(S.over&&S.endData)setTimeout(()=>showEnd(S.endData.title,S.endData.story,S.endData.good),0)}else $("#creator").classList.add("show");$("#endMonthBtn").onclick=endMonth;$("#resetBtn").onclick=requestRestart;document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.addEventListener("click",()=>document.querySelectorAll(".stat.tip-on").forEach(x=>x.classList.remove("tip-on")))}

const API={initialState,makeMarket,createSchedule,teamRating,selectLineup,projectedFinance,simulateMyMatch,simulateLeagueMonth,simulateCup,seasonReview,finalEnding,getEventCount:()=>EVENTS.length,getState:()=>S,setState:s=>S=s,getSponsorSlotCount:()=>Object.keys(SPONSOR_SLOTS).length,getFacilityCount:()=>Object.keys(FACILITIES).length};
if(typeof window!=="undefined")window.FootballOwnerGame=API;else globalThis.FootballOwnerGame=API;
Object.assign(globalThis,{ACTIONS,chooseArchetype,startGame,switchTab,setSquadFilter,setMarketFilter,setRelationFilter,toggleTip,openBid,toggleList,acceptSale,rejectSale,renewPlayer,releasePlayer,promoteYouth,releaseYouth,upgradeAcademy,hireCoach,fireCoach,signSponsor,upgradeFacility,repayDebt,borrowMoney,npcMenu,interactNpc,restartGame});
if(typeof document!=="undefined")init();
</script>
